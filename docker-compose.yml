# ==============================================================================
# SQLArena - Docker Compose Principal (Produção AWS EC2 & Ambiente Local)
# ==============================================================================
# Serviços:
# 1. postgres         -> Banco Relacional Principal (substitui Amazon RDS)
# 2. postgres-sandbox -> Banco Relacional Isolado para execução de queries do Worker
# 3. redis            -> Cache em Memória e Rate Limit de 5s (substitui ElastiCache)
# 4. minio            -> Armazenamento de Objetos S3-Compatible (substitui Amazon S3)
# 5. kafka            -> Mensageria Assíncrona em modo KRaft (substitui Amazon SQS)
# 6. backend          -> API FastAPI + Seed Inicial + Conexão com AWS DynamoDB
# 7. worker           -> Consumidor Kafka + Avaliação em Sandbox + Lazy-Load MinIO
# 8. frontend         -> React SPA servida via Nginx com Reverse Proxy para /api
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados Relacional Principal (Substitui o Amazon RDS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sqlarena-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 2. Banco de Dados PostgreSQL Sandbox (Exclusivo para o Worker)
  # ----------------------------------------------------------------------------
  postgres-sandbox:
    image: postgres:16-alpine
    container_name: sqlarena-postgres-sandbox
    restart: unless-stopped
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: ${SANDBOX_POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD:-sandboxpass}
      POSTGRES_DB: ${SANDBOX_POSTGRES_DB:-sandbox_db}
    volumes:
      - ./data/postgres-sandbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_POSTGRES_USER:-sandbox} -d ${SANDBOX_POSTGRES_DB:-sandbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 3. Cache Redis & Rate Limit (Substitui o Amazon ElastiCache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sqlarena-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 4. Armazenamento de Objetos MinIO (Substitui o Amazon S3)
  # ----------------------------------------------------------------------------
  minio:
    image: elestio/minio:latest
    container_name: sqlarena-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3-Compatible
      - "9001:9001"   # Console Web do MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 5. Fila de Mensagens Apache Kafka em modo KRaft (Substitui o Amazon SQS)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: sqlarena-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 6. Backend API (FastAPI + Conexão com AWS DynamoDB, Postgres, MinIO, Kafka, Redis)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: sqlarena-backend:latest
    container_name: sqlarena-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SERVICE_ROLE: backend
      RUN_SEED: ${RUN_SEED:-true}
      APP_PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-sqlarena-production-super-secret-key-32chars-min}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-sqlarena-internal-service-secret-key-32chars}
      BACKEND_INTERNAL_URL: http://backend:8000

      # PostgreSQL Principal (Container)
      RDS_HOST: postgres
      RDS_PORT: 5432
      RDS_USER: ${POSTGRES_USER:-postgres}
      RDS_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      RDS_DB_NAME: ${POSTGRES_DB:-app_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-app_db}

      # Redis (Container)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0

      # MinIO Object Storage (Container substituindo S3)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sqlarena-questions-bucket}

      # Apache Kafka (Container substituindo SQS)
      QUEUE_BACKEND: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sqlarena-submissions-queue}
      KAFKA_DLQ_TOPIC_NAME: ${KAFKA_DLQ_TOPIC_NAME:-sqlarena-submissions-queue-dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-sqlarena-workers-group}

      # AWS DynamoDB (Serviço NoSQL na AWS)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-sqlarena-submissions-log}
      DYNAMODB_CRUD_TABLE_NAME: ${DYNAMODB_CRUD_TABLE_NAME:-sqlarena-crud-actions-log}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 7. Worker Assíncrono (Consome Kafka, Baixa do MinIO e Executa no PG Sandbox)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: app/worker/Dockerfile
    image: sqlarena-worker:latest
    container_name: sqlarena-worker
    restart: unless-stopped
    command: ["python", "app/worker/main.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SERVICE_ROLE: worker
      RUN_SEED: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-sqlarena-internal-service-secret-key-32chars}
      BACKEND_INTERNAL_URL: http://backend:8000

      # Conectado exclusivamente ao PostgreSQL Sandbox isolado
      SANDBOX_DATABASE_URL: postgresql://${SANDBOX_POSTGRES_USER:-sandbox}:${SANDBOX_POSTGRES_PASSWORD:-sandboxpass}@postgres-sandbox:5432/${SANDBOX_POSTGRES_DB:-sandbox_db}

      # MinIO (para lazy-loading dos scripts SQL das questões)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sqlarena-questions-bucket}

      # Apache Kafka (para consumir submissões)
      QUEUE_BACKEND: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sqlarena-submissions-queue}
      KAFKA_DLQ_TOPIC_NAME: ${KAFKA_DLQ_TOPIC_NAME:-sqlarena-submissions-queue-dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-sqlarena-workers-group}
    depends_on:
      postgres-sandbox:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - sqlarena-net

  # ----------------------------------------------------------------------------
  # 8. Frontend SPA (React + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sqlarena-frontend:latest
    container_name: sqlarena-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sqlarena-net

networks:
  sqlarena-net:
    driver: bridge
