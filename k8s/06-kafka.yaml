# ==============================================================================
# 06 - Apache Kafka em modo KRaft (Substitui o Amazon SQS)
# Serviço de fila de mensagens assíncronas com 3 partições por padrão para
# permitir consumo paralelo pelos Pods de Worker escalados via Kubernetes.
# Exposto internamente via Service ClusterIP (kafka-service:9092).
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: sqlarena
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlarena
      component: kafka
  template:
    metadata:
      labels:
        app: sqlarena
        component: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: sqlarena
    component: kafka
spec:
  type: ClusterIP
  selector:
    app: sqlarena
    component: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
