# ==============================================================================
# 07 - POD 1: Camada Web (Frontend React/Nginx + Backend FastAPI no mesmo Pod!)
# ==============================================================================
# Substitui a antiga Golden AMI 1 (Web ASG).
# No mesmo Pod coexistem:
# 1. Container 'backend'  (FastAPI na porta 8000)
# 2. Container 'frontend' (Nginx na porta 80 fazendo proxy reverso para 127.0.0.1:8000)
#
# Serviços K8s:
# - sqlarena-web-clusterip (ClusterIP): Comunicação interna (callbacks dos Workers)
# - sqlarena-web-nodeport  (NodePort):  Acesso público externo na porta 30080 (e 30800)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlarena-web
  labels:
    app: sqlarena
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlarena
      tier: web
  template:
    metadata:
      labels:
        app: sqlarena
        tier: web
    spec:
      containers:
        # ----------------------------------------------------------------------
        # Container 1: Backend API (FastAPI)
        # ----------------------------------------------------------------------
        - name: backend
          image: sqlarena-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http-api
          envFrom:
            - configMapRef:
                name: sqlarena-config
          env:
            - name: SERVICE_ROLE
              value: "backend"
            - name: RUN_SEED
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: SECRET_KEY
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: INTERNAL_API_KEY
            - name: RDS_USER
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: POSTGRES_USER
            - name: RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: DATABASE_URL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sqlarena-secrets
                  key: AWS_SESSION_TOKEN
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # ----------------------------------------------------------------------
        # Container 2: Frontend SPA (React + Nginx compartilhando localhost no Pod)
        # ----------------------------------------------------------------------
        - name: frontend
          image: sqlarena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-web
          env:
            # Como o Frontend e o Backend rodam no MESMO Pod, compartilham 127.0.0.1!
            - name: BACKEND_UPSTREAM
              value: "http://127.0.0.1:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
# Service 1: ClusterIP para comunicação interna no cluster (ex: Callbacks HTTP dos Workers)
apiVersion: v1
kind: Service
metadata:
  name: sqlarena-web-clusterip
  labels:
    app: sqlarena
    tier: web
spec:
  type: ClusterIP
  selector:
    app: sqlarena
    tier: web
  ports:
    - name: http-web
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http-api
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# Service 2: NodePort para expor a aplicação externamente nos nós do Kubernetes
apiVersion: v1
kind: Service
metadata:
  name: sqlarena-web-nodeport
  labels:
    app: sqlarena
    tier: web
spec:
  type: NodePort
  selector:
    app: sqlarena
    tier: web
  ports:
    - name: http-web
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
    - name: http-api
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
