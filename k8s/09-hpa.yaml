# ==============================================================================
# 09 - HorizontalPodAutoscaler (HPA): Escalabilidade Automática dos Pods no K8s
# ==============================================================================
# Escala automaticamente:
# - Pod 1 (sqlarena-web: Front + Back) de 1 até 4 réplicas quando CPU > 70%
# - Pod 2 (sqlarena-worker: Worker + PG Sandbox) de 1 até 4 réplicas quando CPU > 60%
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sqlarena-web-hpa
  labels:
    app: sqlarena
    tier: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sqlarena-web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sqlarena-worker-hpa
  labels:
    app: sqlarena
    tier: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sqlarena-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
