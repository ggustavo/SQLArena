# ==============================================================================
# 02 - Secret: Credenciais e Chaves Sensíveis do SQLArena no Kubernetes
# ==============================================================================
# IMPORTANTE: Em produção na AWS (EKS ou EC2), atualize AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN com suas credenciais do AWS Academy
# (ou deixe em branco caso os nós do EKS utilizem a IAM Role 'LabRole').
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sqlarena-secrets
  labels:
    app: sqlarena
type: Opaque
stringData:
  # Chaves de segurança da API e comunicação interna
  SECRET_KEY: "sqlarena-k8s-production-super-secret-key-32chars-min"
  INTERNAL_API_KEY: "sqlarena-internal-service-secret-key-32chars"

  # Credenciais do PostgreSQL Principal (Substitui o RDS)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres-service:5432/app_db"

  # Credenciais do PostgreSQL Sandbox (Sidecar no mesmo Pod do Worker em 127.0.0.1:5432)
  SANDBOX_POSTGRES_USER: "sandbox"
  SANDBOX_POSTGRES_PASSWORD: "sandboxpass"
  SANDBOX_DATABASE_URL: "postgresql://sandbox:sandboxpass@127.0.0.1:5432/sandbox_db"

  # Credenciais do MinIO (Substitui o Amazon S3)
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"

  # Credenciais para acesso ao Amazon DynamoDB:
  # - Modo 1 (AWS Real): Cole suas credenciais temporárias do AWS Academy (ASIA..., etc.)
  # - Modo 2 (Ministack Offline): Defina AWS_ACCESS_KEY_ID: "test", AWS_SECRET_ACCESS_KEY: "test" e deixe AWS_SESSION_TOKEN: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
