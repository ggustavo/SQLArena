services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      GATEWAY_PORT: 4566
      LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"

  stackport:
    image: davireis/stackport:latest
    container_name: stackport
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - ministack
    restart: "no"
